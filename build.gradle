plugins {
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.jetbrains.kotlin.jvm' version '1.9.22'
}
version = mod_version
group = 'com.heledron.spideranimation'
base { archivesName = 'octoarachnopod' }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
minecraft {
    mappings channel: 'official', version: minecraft_version
    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')
    runs {
        client { workingDirectory project.file('run'); mods { arachnomod { source sourceSets.main } } }
        server { workingDirectory project.file('run/server'); mods { arachnomod { source sourceSets.main } } }
    }
}
repositories {
    maven { name = 'Kotlin for Forge'; url = 'https://thedarkcolour.github.io/KotlinForForge/' }
}
dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    implementation "thedarkcolour:kotlinforforge:${kff_version}"
}
processResources {
    inputs.property 'version', project.version
    filesMatching('META-INF/mods.toml') { expand 'version': project.version }
}
compileKotlin { kotlinOptions.jvmTarget = '17' }
jar.finalizedBy('reobfJar')
